<main>
    <h1>River Rush Rafting</h1>

    <form action="#" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="useremail">Email Address:</label>
        <input type="email" id="useremail" name="useremail" required>

        <fieldset>
            <legend>Purpose of Message:</legend>
            <label for="general">
                <input type="radio" id="general" name="purpose" value="general" checked> General
                Inquiry
            </label>
            <label for="reservation">
                <input type="radio" id="reservation" name="purpose" value="reservation"> Reservation
            </label>
            <label for="website">
                <input type="radio" id="website" name="purpose" value="website"> Website Suggestion
            </label>
        </fieldset>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <label for="subscribe">
            <input type="checkbox" id="subscribe" name="subscribe" value="yes"> Please subscribe me
            to the monthly newsletter
        </label>

        <button type="submit">Send Message</button>
    </form>
</main>
