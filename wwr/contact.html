<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="description"
      content="Do you have questions about our white water rafting trips or need help with a reservation? Contact the River Rush Rafting team today.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | River Rush Rafting</title>
    <meta name="author" content="Vanelle GAKOSSO">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="River Rush Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="company-info">
            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street<br>Kolob, California<br>+1 999 999 9999<br>info@whitewater.com
            </p>
        </div>

        <div class="map-form-container">
            <div class="map-box">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3105.123456789!2d-111.891!3d40.760!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDDCsDQ1JzM2LjAiTiAxMTHCsDUzJzI3LjYiVw!5e0!3m2!1sen!2sus!4v1234567890"
                  width="100%" height="100%" loading="lazy"></iframe>
            </div>

            <form action="#" method="post" class="contact-form">
                <div class="form-row">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username" placeholder="Placeholder"
                      required>
                </div>

                <div class="form-row">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="Placeholder"
                      required>
                </div>

                <div class="form-row radio-row">
                    <span class="label-title">Message Purpose</span>
                    <div class="radio-options">
                        <label><input type="radio" name="purpose" value="general" checked> General
                            Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation"> Reservation
                            Question</label>
                        <label><input type="radio" name="purpose" value="suggestion"> Website
                            Suggestion</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here"
                      required></textarea>
                </div>

                <div class="checkbox-row">
                    <label><input type="checkbox" name="newsletter" value="subscribe"> Please
                        Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/manager.jpg" alt="Sofia PETER, General Manager">
                    <figcaption>
                        <strong>Sofia PETER – General Manager</strong>
                        <p>Sofia manages daily work, staff schedules, and customer service to make
                            sure every trip runs smoothly.</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/coach.jpg" alt="Marcus LANDE, Coach">
                    <figcaption>
                        <strong>Marcus LANDE – Coach</strong>
                        <p>Marcus leads hands-on paddling workshops and training sessions for guests
                            to help them feel confident.</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/monitor.jpg" alt="Helena BARBE, Monitor">
                    <figcaption>
                        <strong>Helena BARBE – Monitor</strong>
                        <p>Helena is in charge of river safety, inspecting gear before every trip to
                            keep everyone safe.</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/guide.jpg" alt="Martina MARTES, River Guide">
                    <figcaption>
                        <strong>Martina MARTES – River Guide</strong>
                        <p>Martina leads raft trips down the river, steering through big waves while
                            keeping guests entertained.</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 River Rush Rafting | Vanelle GAKOSSO</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Follow us on Facebook"></a>
            <a href="#"><img src="images/youtube.png" alt="Watch our videos on YouTube"></a>
            <a href="#"><img src="images/instagram.png" alt="Follow us on Instagram"></a>
        </nav>
    </footer>

</body>

</html>
